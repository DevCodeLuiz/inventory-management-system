
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: #8b949e;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
        }

        .card h3 {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .card strong {
            font-size: 28px;
        }

        .products {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
        }

        .products h2 {
            margin-bottom: 20px;
        }

        .empty {
            color: #8b949e;
            padding: 20px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>📦 Inventory Management</h1>
            <p>Product management and inventory control system</p>
        </header>

        <section class="dashboard">

            <div class="card">
                <h3>Total Products</h3>
                <strong>0</strong>
            </div>

            <div class="card">
                <h3>Total Stock</h3>
                <strong>0</strong>
            </div>

            <div class="card">
                <h3>Low Stock</h3>
                <strong>0</strong>
            </div>

        </section>

        <section class="products">

            <h2>Products</h2>

            <p class="empty">
                No products registered yet.
            </p>

        </section>

    </div>

</body>
</html>
